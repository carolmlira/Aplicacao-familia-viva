<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto Firebase</title>
</head>
<body>
    <h1>Olá, Firebase!</h1>
    <button onclick="buscarDados()">Buscar Dados</button>
    <ul id="dados"></ul>

    <script>
        async function buscarDados() {
            const resposta = await fetch("http://localhost:5000/test");
            const dados = await resposta.json();
            document.getElementById("dados").innerHTML = 
                dados.data.map(item => `<li>${item.nome}</li>`).join("");
        }
    </script>
</body>
</html>
